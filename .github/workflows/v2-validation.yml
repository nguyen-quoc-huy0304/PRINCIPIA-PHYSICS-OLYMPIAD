name: PRINCIPIA V2 validation

on:
  push:
    branches: [rebuild-v2]
    paths:
      - "v2/**"
      - ".github/workflows/v2-validation.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-validation.yml"
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm install
      - run: npm run build

  tauri-rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "v2/src-tauri -> target"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Check Rust desktop shell
        run: cargo check --manifest-path v2/src-tauri/Cargo.toml
