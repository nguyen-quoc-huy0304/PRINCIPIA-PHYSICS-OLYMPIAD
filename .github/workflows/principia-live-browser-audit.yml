name: PRINCIPIA live browser audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: principia-live-browser-audit
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Open production PRINCIPIA in Chromium
        env:
          PRINCIPIA_URL: https://principia-physics-olympiad-pro.pages.dev
        run: node scripts/principia-browser-audit.mjs

      - name: Upload screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principia-live-browser-audit
          path: artifacts/principia-browser-audit/
          if-no-files-found: warn
          retention-days: 14
