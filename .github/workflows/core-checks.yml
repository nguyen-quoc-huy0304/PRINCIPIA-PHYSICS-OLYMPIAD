name: PRINCIPIA Native Core Checks
on:
  push:
    paths: ["rust/**", "src/physics/**", "tests/**", "assets/js/**", "index.html", ".github/workflows/core-checks.yml"]
  pull_request:
    paths: ["rust/**", "src/physics/**", "tests/**", ".github/workflows/core-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Benchmark native C++ FFI against Rust baseline
        run: cargo bench --manifest-path rust/Cargo.toml --bench physics
  polyglot-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native Rust + C++ core
        run: cargo build --manifest-path rust/Cargo.toml --release --bin principia-core-server
      - name: Verify JSON-line protocol with Go
        env:
          PRINCIPIA_CORE_BIN: ${{ github.workspace }}/rust/target/release/principia-core-server
        run: cd tests/go && go test -v ./...
      - name: Cross-check scientific outputs with C# oracle
        env:
          PRINCIPIA_CORE_BIN: ${{ github.workspace }}/rust/target/release/principia-core-server
        run: dotnet run --project tests/dotnet/Principia.ContractTests.csproj --configuration Release
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed application scripts
        run: |
          node --check assets/js/core/performance.js
          node --check assets/js/app-part-02.js
          node --check assets/js/physics-engine.js
          node --check assets/js/principia-external-labs.js
          node --check assets/js/principia-robotics-lab.js
          node --check assets/js/principia-data-lab.js
          node --check assets/js/principia-physics-puzzles.js
          node --check assets/js/principia-space-explorer.js
          node --check assets/js/principia-robot-assembly.js
          node --check assets/js/principia-collision-lab.js
          node --check assets/js/principia-backup.js
          node --check assets/js/principia-mystery-core.js
          node --check assets/js/principia-progression-core.js
          node --check assets/js/principia-season-core.js
          node --check assets/js/principia-learning-suite.js
          node --check assets/js/principia-level-studio-core.js
          node --check assets/js/principia-level-studio.js
          node --check assets/js/principia-research-core.js
          node --check assets/js/principia-research.js
          node --test tests/js/*.test.cjs
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test C++ physics kernel
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/physics -c src/physics/engine_c_test.c -o /tmp/principia-c-test.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp src/physics/engine_test.cpp -o /tmp/principia-physics-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp /tmp/principia-c-test.o -o /tmp/principia-c-abi-test
          /tmp/principia-physics-test
          /tmp/principia-c-abi-test
