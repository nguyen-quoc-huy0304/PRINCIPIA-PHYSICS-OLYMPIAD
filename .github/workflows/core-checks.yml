name: PRINCIPIA Native Core Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Benchmark native C++ FFI against Rust baseline
        run: cargo bench --manifest-path rust/Cargo.toml --bench physics
  polyglot-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native Rust + C++ core
        run: cargo build --manifest-path rust/Cargo.toml --release --bin principia-core-server
      - name: Verify JSON-line protocol with Go
        env:
          PRINCIPIA_CORE_BIN: ${{ github.workspace }}/rust/target/release/principia-core-server
        run: cd tests/go && go test -v ./...
      - name: Cross-check scientific outputs with C# oracle
        env:
          PRINCIPIA_CORE_BIN: ${{ github.workspace }}/rust/target/release/principia-core-server
        run: dotnet run --project tests/dotnet/Principia.ContractTests.csproj --configuration Release
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every JavaScript source file
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run JavaScript unit tests
        run: npm test

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test C++ physics kernel
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/physics -c src/physics/engine_c_test.c -o /tmp/principia-c-test.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp src/physics/engine_test.cpp -o /tmp/principia-physics-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp /tmp/principia-c-test.o -o /tmp/principia-c-abi-test
          /tmp/principia-physics-test
          /tmp/principia-c-abi-test
