name: PRINCIPIA Native Core Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Check Rust WebAssembly boundary
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown --lib
      - name: Benchmark native C++ FFI against Rust baseline
        run: cargo bench --manifest-path rust/Cargo.toml --bench physics
  polyglot-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build native Rust + C++ core
        run: cargo build --manifest-path rust/Cargo.toml --release --bin principia-core-server
      - name: Verify JSON-line protocol with Go
        env:
          PRINCIPIA_CORE_BIN: ${{ github.workspace }}/rust/target/release/principia-core-server
        run: cd tests/go && go test -v ./...
      - name: Test Go HTTP API gateway
        run: cd services/go-api && go test -race ./...
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check every JavaScript source file
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
      - name: Run JavaScript unit tests
        run: npm test

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile and test C++ physics kernel
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/physics -c src/physics/trajectory_c.c -o /tmp/principia-trajectory-c.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/physics -c src/physics/engine_c_test.c -o /tmp/principia-c-test.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp src/physics/engine_test.cpp /tmp/principia-trajectory-c.o -o /tmp/principia-physics-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/physics/engine.cpp /tmp/principia-c-test.o /tmp/principia-trajectory-c.o -o /tmp/principia-c-abi-test
          /tmp/principia-physics-test
          /tmp/principia-c-abi-test

  market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format and test isolated market data service
        run: |
          test -z "$(gofmt -l services/market-data/*.go)"
          cd services/market-data
          go test -race ./...
          go vet ./...
