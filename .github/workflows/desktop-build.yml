name: PRINCIPIA - Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    name: Build desktop · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Install dependencies
        run: npm install
      - name: Build PRINCIPIA desktop app
        run: npm run tauri:build
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: principia-${{ matrix.platform }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
            target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
