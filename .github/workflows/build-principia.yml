name: PRINCIPIA - Web Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite production build
        run: npm run build
