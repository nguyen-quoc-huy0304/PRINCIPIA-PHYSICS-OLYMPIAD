name: Build PRINCIPIA Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'assets/js/app-part-09.js'
      - '.github/workflows/build-windows-app.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PRINCIPIA-Windows-Installer
          path: dist/PRINCIPIA-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish installer as a downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.2
          name: PRINCIPIA PRO v1.0.2
          generate_release_notes: true
          files: dist/PRINCIPIA-Setup.exe
          fail_on_unmatched_files: true
