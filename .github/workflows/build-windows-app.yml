name: Build PRINCIPIA Windows app
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'assets/js/app-part-09.js'
      - '.github/workflows/build-windows-app.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PRINCIPIA-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
