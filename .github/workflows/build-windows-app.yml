name: Build PRINCIPIA desktop apps

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after all desktop builds pass"
        required: true
        type: boolean
        default: false
      tag_name:
        description: "Release tag (used only when publish_release is enabled)"
        required: true
        type: string
        default: "desktop-v1.0.4"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: dist:win
            artifact: PRINCIPIA-Windows
          - platform: linux
            os: ubuntu-latest
            command: dist:linux
            artifact: PRINCIPIA-Linux
          - platform: macos
            os: macos-latest
            command: dist:mac
            artifact: PRINCIPIA-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test native Rust and C++ core on this platform
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Build Rust core sidecar for packaging
        run: cargo build --release --manifest-path rust/Cargo.toml --bin principia-core-server
      - run: npm install
      - name: Run JavaScript regression tests before packaging
        run: npm test
      - name: Regenerate Windows icon from the cropped circular logo with alpha transparency
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pillow
          python desktop/scripts/generate-icons.py
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop installers
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: PRINCIPIA PRO ${{ inputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: true
