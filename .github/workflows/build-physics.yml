name: Build PRINCIPIA Physics Core
on:
  workflow_dispatch:
  push:
    paths:
      - "src/physics/**"
      - "tsconfig.physics.json"
      - ".github/workflows/build-physics.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile TypeScript
        run: npx --yes --package typescript tsc -p tsconfig.physics.json
      - name: Compile C++ to WebAssembly
        uses: mymindstorm/setup-emsdk@v14
      - name: Build WASM module
        run: |
          mkdir -p build/wasm
          em++ src/physics/engine.cpp -O3 -std=c++17 -s STANDALONE_WASM=1 -s EXPORTED_FUNCTIONS='["_principia_velocity","_principia_displacement","_principia_kinetic_energy","_principia_projectile_range","_principia_projectile_max_height"]' -Wl,--no-entry -o build/wasm/physics-engine.wasm
      - name: Upload physics build
        uses: actions/upload-artifact@v4
        with:
          name: principia-physics-core
          path: |
            assets/js/physics-engine.js
            build/wasm/physics-engine.wasm
          if-no-files-found: error
          retention-days: 14
