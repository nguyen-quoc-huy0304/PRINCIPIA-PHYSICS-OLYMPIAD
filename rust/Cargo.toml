[package]
name = "principia-core"
version = "0.1.0"
edition = "2021"
description = "PRINCIPIA primary Rust application core with native C++ physics kernels"
license = "UNLICENSED"
build = "build.rs"

[lib]
name = "principia_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[[bench]]
name = "physics"
path = "benches/physics.rs"
harness = false

[build-dependencies]
cc = "1"

[dependencies]
serde_json = "1"
wasm-bindgen = "0.2"
# Rapier is the upstream Apache-2.0 rigid-body engine for 3D mechanics and robotics.
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }

[[bin]]
name = "principia-core-server"
path = "src/bin/principia-core-server.rs"

# Keep the optimized Rust release build; skip Binaryen's extra pass because
# strip=true removes target_features metadata needed to validate memory.fill.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
