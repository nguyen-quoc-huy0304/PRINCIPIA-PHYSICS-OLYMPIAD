[package]
name = "principia-physics-core"
version = "2.0.0"
edition = "2021"
description = "Shared high-performance Rust physics core for PRINCIPIA"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
panic = "abort"
