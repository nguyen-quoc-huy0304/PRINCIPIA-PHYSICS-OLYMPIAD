[package]
name = "principia-physics-core"
version = "2.0.0"
edition = "2021"
description = "Shared high-performance Rust physics core for PRINCIPIA"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
